/* Only APPROVED techniques ever reach this screen (see TECHNIQUES API). The
   "Reviewed" mark is shown on every page anyway, so the promise is visible to
   the reader rather than implicit in the plumbing. */
function TechniquesScreen(){
  const [state, setState] = useState({ phase:"loading", rows:[], err:"" });
  const load = useCallback(async () => {
    setState(s => ({ ...s, phase:"loading", err:"" }));
    try{ setState({ phase:"ready", rows: await techniquesGet(), err:"" }); }
    catch(e){ log("ERROR","techniques: "+e.message); setState({ phase:"error", rows:[], err: e.message }); }
  }, []);
  useEffect(() => { load(); }, [load]);

  if(state.phase === "loading") return <div className="spin spin-lg"></div>;
  if(state.phase === "error") return (
    <div className="card" style={{marginTop:14}}>
      <div className="auth-msg err">{state.err}</div>
      <button className="btn btn-ghost btn-block" onClick={load}>Try again</button>
    </div>
  );
  if(!state.rows.length) return (
    <Empty icon={ICONS.flame} title="No techniques published yet">
      Searing, braising, reverse-searing, grilling over two zones and more. Every page is reviewed before it appears here.
    </Empty>
  );
  return (
    <div className="list">
      {state.rows.map(t => (
        <div key={t.id} className="item">
          <div className="item-body">
            <div className="item-title">{t.title}</div>
            <div className="item-meta">
              {t.category && <span className="chip amber">{t.category}</span>}
              <span className="reviewed-note"><Icon d={ICONS.check} size={13}/> Reviewed</span>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* Which tags count as a problem worth isolating. WARN is included because a
   silent fallback (a bad env value, a rejected match) is exactly the kind of
   thing you want to see when something "seems fine but is not". */
const PROBLEM_TAGS = ["ERROR", "WARN"];

function SettingsScreen({ store, onCheckUpdate, updMsg, update, onApplyUpdate }){
  const [logProblems, setLogProblems] = useState(false);
  const [copied, setCopied] = useState(false);
  const [showLog, setShowLog] = useState(false);

  const problems = LOG.filter(l => PROBLEM_TAGS.indexOf(l.tag) !== -1);
  const errCount = problems.length;
  const shownLog = (logProblems ? problems : LOG).slice(-120);

  /* Copies what is ON SCREEN, so "problems only" then Copy gives exactly the
     problems. Header carries version and build - a log without them is a log
     nobody can act on. Falls back to a selectable prompt where the clipboard
     API is unavailable (older iOS in standalone mode) rather than failing
     silently. */
  const copyLog = async () => {
    const NL = String.fromCharCode(10);
    const header = "CaptainCook v" + APP_VERSION + " (build " + BUILD + ")"
                 + (logProblems ? " - problems only" : "") + NL;
    const body = shownLog.map(l => l.t + " [" + l.tag + "] " + l.msg).join(NL);
    const text = header + (body || "(nothing logged)");
    try{
      await navigator.clipboard.writeText(text);
      setCopied(true); setTimeout(()=>setCopied(false), 1800);
    }catch(e){
      try{ window.prompt("Copy the log:", text); }catch(_){}
    }
  };
  /* EXPORT. Everything the account holds, in one file, written on the device.
     Deliberately not a server job with an email: getting your data back should
     not require asking anyone. When recipe photos land they must be embedded
     here too (FitnessCaptain's progress-photo export is the pattern) - a
     portability right that quietly omits the photos is not the right honoured. */
  const [exporting, setExporting] = useState(false);
  const [delPhase, setDelPhase] = useState("idle");   // idle | confirm | busy
  const [delWord, setDelWord]   = useState("");
  const [delErr, setDelErr]     = useState("");
  const [reloadAsk, setReloadAsk] = useState(false);

  const exportData = async () => {
    setExporting(true);
    try{
      const payload = { app: "CaptainCook", version: APP_VERSION,
                        exportedAt: nowISO(), account: store.authEmail || null,
                        settings: store.cfg };
      FILES.forEach(f => { payload[f] = store.data[f] || []; });
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
      const url  = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "captaincook-" + todayStr() + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(_){} }, 1000);
      log("EXPORT","exported "+(payload.recipes||[]).length+" recipes");
    }catch(e){ log("ERROR","export: "+e.message); }
    finally{ setExporting(false); }
  };

  const deleteAccount = async () => {
    setDelErr(""); setDelPhase("busy");
    try{
      const token = await authToken();
      if(!token) throw new Error("Not signed in.");
      const r = await fetch(API_BASE + "/api/account", {
        method:"DELETE",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+token },
        body: JSON.stringify({ confirm:"DELETE" }),
      });
      if(!r.ok){
        let msg = "Delete failed ("+r.status+").";
        try{ const j = await r.json(); if(j && j.detail) msg = j.detail; }catch(_){}
        throw new Error(msg);
      }
      /* The rows are gone server-side, so the local copy has to go too before
         signing out. Leaving it would let the cache resurrect a deleted log on
         the next launch, which would be a bad thing to discover. */
      try{ localStorage.clear(); }catch(_){}
      log("ACCOUNT","account deleted");
      await store.signOut();
      try{ location.reload(); }catch(_){}
    }catch(e){
      setDelErr(e.message || "Couldn't delete the account.");
      setDelPhase("confirm");
      log("ERROR","account delete: "+e.message);
    }
  };

  const setUnits = (u) => store.saveCfg({ ...store.cfg, units: u });
  return (
    <div>
      <div className="set-group">Account</div>
      <div className="card">
        <div className="subtle" style={{marginBottom:10}}>{store.authEmail || "Signed in"}</div>
        <button className="btn btn-ghost btn-block" onClick={()=>store.signOut()}>Sign out</button>
      </div>

      <div className="set-group">Preferences</div>
      <div className="card">
        <div className="subtle">Measurements</div>
        <div className="pills">
          <button className={"pill "+(store.cfg.units==="us"?"on":"")} onClick={()=>setUnits("us")}>US (cups, &deg;F)</button>
          <button className={"pill "+(store.cfg.units==="metric"?"on":"")} onClick={()=>setUnits("metric")}>Metric (grams, &deg;C)</button>
        </div>
      </div>

      {/* YOUR DATA. The Privacy Policy promises both of these are reachable
          without emailing anyone, so they have to exist here. A policy that
          describes a right nobody implemented is worse than no policy. */}
      <div className="set-group">Your data</div>
      <div className="card">
        <div className="subtle" style={{marginBottom:10}}>
          Everything you have saved, as a file you keep. No request, no
          waiting.
        </div>
        <button className="btn btn-ghost btn-block" onClick={exportData} disabled={exporting}>
          {exporting ? <span className="spin"></span>
                     : <><Icon d={ICONS.text} size={15}/> Export my data</>}
        </button>

        <div className="subtle" style={{marginTop:18,marginBottom:10}}>
          Deleting removes your recipes, plans and lists and your sign-in,
          permanently. Export first if you want a copy.
        </div>
        {delPhase === "idle" &&
          <button className="btn btn-ghost btn-block" onClick={()=>setDelPhase("confirm")}>
            <Icon d={ICONS.trash} size={15}/> Delete my account
          </button>}
        {delPhase === "confirm" &&
          <div>
            {/* Typing the word, not a second tap. The undo that covers a
                mis-swiped row cannot cover this one, so the gesture has to be
                one you cannot make by accident. */}
            <div className="subtle" style={{marginBottom:8}}>
              Type <strong>DELETE</strong> to confirm. This cannot be undone.
            </div>
            <input className="input" value={delWord} autoFocus
              onChange={e=>setDelWord(e.target.value)} placeholder="DELETE" />
            <div className="row" style={{gap:8,marginTop:10}}>
              <button className="btn btn-ghost btn-sm" style={{flex:1}}
                onClick={()=>{ setDelPhase("idle"); setDelWord(""); setDelErr(""); }}>Keep my account</button>
              <button className="btn btn-primary btn-sm" style={{flex:1}}
                disabled={delWord.trim().toUpperCase()!=="DELETE"}
                onClick={deleteAccount}>Delete forever</button>
            </div>
          </div>}
        {delPhase === "busy" && <div className="row center" style={{marginTop:6}}><span className="spin"></span></div>}
        {delErr && <div className="auth-msg err" style={{marginTop:10}}>{delErr}</div>}
      </div>

      {/* Reload from cloud: the confirm is inline, not a dialog, and says
          exactly what is lost. */}
      <div className="card" style={{marginTop:10}}>
        {!reloadAsk
          ? <button className="btn btn-ghost btn-block" onClick={()=>setReloadAsk(true)}>
              <Icon d={ICONS.refresh} size={15}/> Reload from cloud
            </button>
          : <div>
              <div className="subtle" style={{marginBottom:10}}>
                Discard this device's copy and pull the latest from the cloud? Any
                change here that hasn't synced yet will be lost.
              </div>
              <div className="row" style={{gap:8}}>
                <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>setReloadAsk(false)}>Cancel</button>
                <button className="btn btn-primary btn-sm" style={{flex:1}}
                  onClick={()=>{ setReloadAsk(false); store.reloadFromCloud(); }}>Reload</button>
              </div>
            </div>}
      </div>

      <div className="set-group">About</div>
      <div className="updrow">
        {update
          ? <button className="btn btn-primary btn-sm" style={{margin:0}} onClick={()=>onApplyUpdate && onApplyUpdate()}><Icon d={ICONS.sparkle} size={14}/> Update to v{update.ver||update.build}</button>
          : <button className="btn btn-ghost btn-sm" style={{margin:0}} onClick={()=>onCheckUpdate && onCheckUpdate(true)}>Check for updates</button>}
        {updMsg && <span className="hint" style={{margin:0}}>{updMsg}</span>}
      </div>
      <p className="hint center" style={{marginTop:6}}>CaptainCook v{APP_VERSION}</p>

      {/* Chris: "it would be great if we had the log design like the other
          apps where you can copy a block, or show just problems and then copy
          that." Reading a log off a phone screen and retyping it is the worst
          part of reporting a fault, and the ONE line that matters is usually
          buried in forty that do not. */}
      <div className="set-group">Diagnostics</div>
      <div className="card">
        <button className="btn btn-ghost btn-block" onClick={()=>setShowLog(s=>!s)}>{showLog ? "Hide" : "Show"} log</button>
        {showLog && <>
          <div className="row" style={{marginTop:10}}>
            <button className={"btn btn-sm "+(logProblems ? "btn-primary" : "btn-ghost")} style={{flex:1}}
              onClick={()=>setLogProblems(v=>!v)}>
              {logProblems ? "Showing problems" : "Problems only"}
              {errCount>0 ? " ("+errCount+")" : ""}
            </button>
            <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={copyLog}>
              {copied ? "Copied" : "Copy"}
            </button>
          </div>
          <div className="subtle" style={{marginTop:10}}>
            v{APP_VERSION} (build {BUILD}), newest at the bottom.{" "}
            {logProblems
              ? (errCount ? errCount + " problem" + (errCount===1?"":"s") : "No problems logged")
              : LOG.length + " lines"}
          </div>
          <div className="log" style={{marginTop:12}}>
            {shownLog.length === 0
              ? <div className="subtle">Nothing to show. That is the good outcome.</div>
              : shownLog.map((l,i)=>(
                  <div key={i} className={PROBLEM_TAGS.indexOf(l.tag)!==-1 ? "err" : ""}>
                    <span className="t">{l.t} </span><span className="tag">[{l.tag}]</span> {l.msg}
                  </div>
                ))}
          </div>
        </>}
      </div>
    </div>
  );
}

/* ============================================================

/* ============================================================
   APP SHELL
   ============================================================ */
// Nav = Recipes - Plan - Shopping - More. Techniques / Cook log / Pantry live
// under More and keep TABS entries so the topbar titles them when opened.
//
// CENTER + (2026-07-24 nav standard). It opens the recipe editor DIRECTLY
// rather than the usual action sheet: a sheet with one choice in it is an extra
// tap that decides nothing. It becomes a sheet when the second create action
// (import from a link or photo, step 3) arrives.
const TABS = [
  { key:"recipes",    label:"Recipes",    eyebrow:"Cook",       icon:ICONS.book },
  { key:"plan",       label:"Plan",       eyebrow:"This week",  icon:ICONS.calendar },
  { key:"shopping",   label:"Shopping",   eyebrow:"To buy",     icon:ICONS.cart },
  { key:"more",       label:"More",       eyebrow:"Everything", icon:ICONS.more },
  { key:"techniques", label:"Techniques", eyebrow:"Learn",      icon:ICONS.flame },
  { key:"cooklog",    label:"Cook log",   eyebrow:"Made it",    icon:ICONS.check },
  { key:"pantry",     label:"Pantry",     eyebrow:"On hand",    icon:ICONS.jar },
];
const HUB_TABS = ["techniques","cooklog","pantry"];

function App(){
  const store = useStore();
  const [tab, setTab] = useState("recipes");
  const [inSettings, setInSettings] = useState(false);
  const [recipeView, setRecipeView] = useState(null);     // open recipe page (id)
  const [recipeSheet, setRecipeSheet] = useState(null);   // null | {recipe: rec|null}
  const [planFor, setPlanFor] = useState(null);           // date the plan sheet is adding to

  const [toast, setToast] = useState(null);   // null | {msg, undo}
  const toastRef = useRef();
  const showToast = (m) => {
    setToast({ msg: m, undo: null });
    clearTimeout(toastRef.current); toastRef.current = setTimeout(()=>setToast(null), 2200);
  };
  /* Undo for deletions. Every delete in this app is a filter on a collection,
     so the cheapest correct undo is to keep the WHOLE previous array and put
     it back - no index bookkeeping, no partial restore, and order is
     preserved exactly. Held only for as long as the toast is up; after that
     the deletion stands.

     Longer window than a plain toast (6s vs 2.2s) because reading "deleted",
     realising it was wrong and reaching the button takes longer than reading
     a confirmation you expected. */
  const showUndo = (msg, restore) => {
    setToast({ msg, undo: () => { restore(); clearTimeout(toastRef.current); setToast(null); } });
    // Twelve, not six. A plain toast only has to be noticed; an UNDO has to be
    // noticed, read, decided about and then reached for, and Chris was losing
    // it before the decision (FitnessCaptain). Long enough to act, short enough not to sit
    // over the thing you are looking at.
    clearTimeout(toastRef.current); toastRef.current = setTimeout(()=>setToast(null), 12000);
  };
  // --- PWA self-update: fetch the deployed index.html (no-store), read its
  // BUILD stamp, offer a one-tap refresh when a genuinely newer build is live.
  // Checks on launch AND resume AND a periodic timer - installed PWAs are
  // usually RESUMED, not cold-launched (portable fix from MenuCaptain).
  const [update, setUpdate] = useState(null);   // { ver, build } of a newer deployed build, else null
  const [updMsg, setUpdMsg] = useState("");     // inline status for the Settings "Check for updates" row
  const updTimer = useRef(null);
  // Show a status line for a few seconds then clear it (used for terminal results).
  const flashUpd = useCallback((msg)=>{ setUpdMsg(msg); if(updTimer.current) clearTimeout(updTimer.current); updTimer.current = setTimeout(()=>setUpdMsg(""), 4000); },[]);
  // manual=true is the Settings button: show inline "Checking..." then a result. On
  // launch/resume we check quietly and only surface the banner if there's an update.
  // Detection compares the deployed BUILD (monotonic date stamp) so it never misfires;
  // the deployed APP_VERSION is read alongside it purely to LABEL the update ("v0.13.1").
  const checkUpdate = useCallback(async (manual=false)=>{
    if(manual){ if(updTimer.current) clearTimeout(updTimer.current); setUpdMsg("Checking..."); }
    try{
      const res = await fetch(location.pathname + "?_=" + Date.now(), { cache:"no-store" });
      if(!res.ok){ log("UPDATE","check http "+res.status); if(manual) flashUpd("Couldn't check - are you online?"); return; }
      const html = await res.text();
      const mb = html.match(/const BUILD = "([^"]+)";/);       const rBuild = mb && mb[1];
      const mv = html.match(/const APP_VERSION = "([^"]+)";/); const rVer = mv && mv[1];
      /* EITHER signal is enough, and that redundancy is the point. Detection
         used to rest on BUILD alone, and BUILD sat unchanged through eight
         releases (0.74 to 0.81) while APP_VERSION climbed - so the check
         honestly reported "you're on the latest" every time and Chris was
         stranded on 0.77 with no way to tell. A release ritual that silently
         breaks the updater when one line is missed is the wrong shape: now a
         changed version is sufficient by itself. */
      const versionMoved = rVer && rVer !== APP_VERSION;
      if((rBuild && buildIsNewer(rBuild, BUILD)) || versionMoved){
        log("UPDATE","update live: v"+(rVer||"?")+" build "+(rBuild||"?")+
                     (versionMoved && !(rBuild && buildIsNewer(rBuild, BUILD)) ? " (version only)" : ""));
        setUpdate({ ver:rVer, build:rBuild || String(Date.now()) }); if(manual) setUpdMsg(""); }
      else { log("UPDATE","up to date (v"+APP_VERSION+", "+BUILD+")"); setUpdate(null); if(manual) flashUpd("You're on the latest (v"+APP_VERSION+")"); }
    }catch(e){ log("UPDATE","check failed: "+e.message); if(manual) flashUpd("Update check failed"); }
  },[flashUpd]);
  useEffect(()=>{
    let last=0; const GAP=60*1000;
    const maybe=()=>{ const now=Date.now(); if(now-last<GAP) return; last=now; checkUpdate(false); };
    const t=setTimeout(maybe, 1500);                       // initial launch check
    const onVis=()=>{ if(document.visibilityState==="visible") maybe(); };
    document.addEventListener("visibilitychange", onVis);
    const iv=setInterval(maybe, 20*60*1000);               // periodic while open
    return ()=>{ clearTimeout(t); clearInterval(iv); document.removeEventListener("visibilitychange", onVis); };
  },[checkUpdate]);

  // Service worker: app-shell offline caching. Registered with a RELATIVE path
  // so the scope is /captaincook-app/ on GitHub Pages ("/sw.js" would 404).
  // Deliberately no web manifest (template decision): without one, Add to Home
  // Screen uses the current page URL as the launch URL.
  useEffect(()=>{
    if(!("serviceWorker" in navigator)) return;
    const onLoad = ()=>{ navigator.serviceWorker.register("sw.js")
      .then(()=>log("SW","registered"))
      .catch(e=>log("SW","register failed: "+(e&&e.message))); };
    if(document.readyState==="complete") onLoad(); else window.addEventListener("load", onLoad);
    return ()=>window.removeEventListener("load", onLoad);
  },[]);

  // Apply by navigating to a build-stamped URL so iOS can't serve cached HTML.
  // Wipe the SW caches first so the new build is never masked by a cached shell.
  function applyUpdate(){
    const stamp=(update&&update.build)||String(Date.now());
    log("UPDATE","applying -> "+stamp);
    try{ if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("clearCache"); }catch(_){}
    window.location.replace(location.pathname + "?u=" + encodeURIComponent(stamp));
  }

  // ---- recipe CRUD ----
  const saveRecipe = (rec) => {
    const all = store.data.recipes || [];
    const exists = all.some(r => r.id === rec.id);
    store.saveCollection("recipes", exists ? all.map(r => r.id === rec.id ? rec : r) : [...all, rec]);
    setRecipeSheet(null);
    if(!exists){ setTab("recipes"); setInSettings(false); setRecipeView(rec.id); }
    showToast(exists ? "Recipe saved" : "Recipe added");
  };
  // Every delete keeps the whole previous array for Undo (the portfolio pattern):
  // no index bookkeeping, and order comes back exactly.
  const deleteRecipe = (id) => {
    const before = (store.data.recipes || []).slice();
    const gone = before.find(r => r.id === id);
    store.saveCollection("recipes", before.filter(r => r.id !== id));
    setRecipeSheet(null); setRecipeView(null);
    showUndo((gone && gone.title ? "\u201c" + gone.title + "\u201d" : "Recipe") + " deleted",
             () => store.saveCollection("recipes", before));
  };
  const openRecipe = (store.data.recipes || []).find(r => r.id === recipeView) || null;

  // Every delete in this app is a filter on one collection, so Undo keeps the
  // whole previous array and puts it back.
  const deleteFrom = (file, id, label) => {
    const before = (store.data[file] || []).slice();
    store.saveCollection(file, before.filter(r => r.id !== id));
    showUndo(label + " removed", () => store.saveCollection(file, before));
  };

  // ---- plan ----
  const savePlan = (entry) => {
    store.saveCollection("meal_plan", [...(store.data.meal_plan || []), entry]);
    setPlanFor(null);
    showToast("Added to the plan");
  };

  // ---- shopping list ----
  const addItems = (lines) => {
    const list = (store.data.shopping_list || []).slice();
    let added = 0, merged = 0, credited = 0;
    const now = nowISO();
    lines.forEach(({ text, from }) => {
      const key = normLine(text);
      if(!key) return;
      const hit = list.find(r => !r.checked && normLine(r.text) === key);
      if(hit){
        if(from && (hit.from||[]).indexOf(from) === -1){
          const i = list.indexOf(hit);
          list[i] = { ...hit, from: [...(hit.from||[]), from], updatedAt: now };
          credited++;
        }
        merged++;
        return;
      }
      list.push({ id: uid(), text: String(text).trim(), aisle: guessAisle(text), checked: false,
                  from: from ? [from] : [], createdAt: now, updatedAt: now });
      added++;
    });
    if(added || credited) store.saveCollection("shopping_list", list);
    return { added, merged, changed: added + credited };
  };
  const buildList = (planned) => {
    const byId = {}; (store.data.recipes || []).forEach(r => { byId[r.id] = r; });
    const lines = [];
    planned.forEach(e => { const r = byId[e.recipeId];
      (r && r.ingredients || []).forEach(i => lines.push({ text: i.text, from: r.title })); });
    const before = (store.data.shopping_list || []).slice();
    const { added, merged, changed } = addItems(lines);
    // Undo is only offered when something actually changed - an Undo that
    // restores an identical list is a button that lies about doing something.
    if(!changed){ showToast("Everything is already on your list"); return; }
    showUndo(added + " item" + (added===1?"":"s") + " added" + (merged ? " (" + merged + " combined)" : ""),
             () => store.saveCollection("shopping_list", before));
  };
  const toggleItem = (id) => store.saveCollection("shopping_list",
    (store.data.shopping_list || []).map(r => r.id === id ? { ...r, checked: !r.checked, updatedAt: nowISO() } : r));
  const clearChecked = () => {
    const before = (store.data.shopping_list || []).slice();
    const n = before.filter(r => r.checked).length;
    store.saveCollection("shopping_list", before.filter(r => !r.checked));
    showUndo(n + " item" + (n===1?"":"s") + " cleared", () => store.saveCollection("shopping_list", before));
  };

  if(!store.authReady){
    return <div className="app"><div className="spin spin-lg"></div></div>;
  }
  if(store.recovery){
    return <SetPassword store={store} />;
  }
  if(!store.authed){
    return <AuthScreen store={store} />;
  }

  const activeTab = TABS.find(t=>t.key===tab) || TABS[0];

  // More stays lit while a hub screen is open.
  const navBtn = (key) => {
    const t = TABS.find(x=>x.key===key);
    const on = tab===key || (key==="more" && HUB_TABS.indexOf(tab)!==-1);
    return (
      <button key={key} className={"nav-btn "+(on?"on":"")} onClick={()=>setTab(key)}
        aria-current={on?"page":undefined}>
        <Icon d={t.icon} size={22}/>
        {t.label}
      </button>
    );
  };

  return (
    <div className="app">
      {update &&
        <button className="update-bar" onClick={applyUpdate}>
          <span><Icon d={ICONS.sparkle} size={14}/> Update available <b>(v{update.ver||update.build})</b></span>
          <span className="update-go">Refresh</span>
        </button>}

      <div className="topbar">
        <div className="topbar-row">
          <div>
            <div className="eyebrow">{inSettings ? "Configure" : activeTab.eyebrow}</div>
            <h1 className="title">{inSettings ? "Settings" : activeTab.label}</h1>
          </div>
          <button className="icon-btn" onClick={()=>setInSettings(s=>!s)} aria-label="Settings">
            <Icon d={inSettings ? ICONS.back : ICONS.gear} size={21}/>
          </button>
        </div>
        {/* The error state is a button: it is the one moment the badge should be
            tappable, and a dead label stuck until something else triggered a
            pull (found on FitnessCaptain). */}
        {store.sync==="error"
          ? <button className="sync error" onClick={()=>store.pullAll()}>
              <span className="dot"></span>
              {(store.syncMsg || "Sync error")} - tap to retry
            </button>
          : <div className={"sync "+store.sync}>
              <span className="dot"></span>
              {store.sync==="idle" && "All changes saved"}
              {store.sync==="busy" && "Syncing..."}
              {store.sync==="pending" && "Offline - will sync"}
            </div>}
      </div>

      <div className="screen">
        {inSettings
          ? <SettingsScreen store={store} onCheckUpdate={checkUpdate} updMsg={updMsg} update={update} onApplyUpdate={applyUpdate} />
          : <>
              {tab==="recipes"    && <RecipesScreen store={store} onAdd={()=>setRecipeSheet({recipe:null})}
                onOpen={setRecipeView} onDelete={deleteRecipe} />}
              {tab==="plan"       && <PlanScreen store={store} onOpenRecipe={setRecipeView} onAddTo={setPlanFor}
                onDelete={(id)=>deleteFrom("meal_plan", id, "Meal")} onBuildList={buildList} />}
              {tab==="shopping"   && <ShoppingScreen store={store} onToggle={toggleItem}
                onAdd={(t)=>addItems([{ text: t, from: null }])} onClearChecked={clearChecked}
                onDelete={(id)=>deleteFrom("shopping_list", id, "Item")} />}
              {tab==="techniques" && <TechniquesScreen />}
              {tab==="cooklog"    && <CookLogScreen store={store} />}
              {tab==="pantry"     && <PantryScreen store={store} />}
              {tab==="more"       && <MoreScreen store={store} onOpen={setTab} onOpenSettings={()=>setInSettings(true)} />}
            </>}
      </div>

      {openRecipe &&
        <RecipePage recipe={openRecipe} onClose={()=>setRecipeView(null)}
          onEdit={()=>setRecipeSheet({recipe: openRecipe})} onDelete={deleteRecipe} />}

      {planFor &&
        <PlanSheet store={store} date={planFor} onSave={savePlan} onClose={()=>setPlanFor(null)} />}

      {recipeSheet &&
        <RecipeSheet key={recipeSheet.recipe ? recipeSheet.recipe.id : "new"} recipe={recipeSheet.recipe}
          onSave={saveRecipe} onDelete={deleteRecipe} onClose={()=>setRecipeSheet(null)} />}

      {!inSettings &&
        <nav className="nav">
          {["recipes","plan"].map(navBtn)}
          <button className="nav-btn nav-fab" onClick={()=>setRecipeSheet({recipe:null})} aria-label="New recipe">
            <span className="fab"><Icon d={ICONS.plus} size={26}/></span>
          </button>
          {["shopping","more"].map(navBtn)}
        </nav>}

      {toast &&
        <div className={"toast" + (toast.undo ? " can-undo" : "")}>
          <span style={{flex:1,minWidth:0}}>{toast.msg}</span>
          {toast.undo &&
            <button className="toast-undo" onClick={toast.undo}>Undo</button>}
        </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
